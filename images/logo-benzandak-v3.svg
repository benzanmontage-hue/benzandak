<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 130" width="680" height="260">
  <defs>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d4832b"/>
      <stop offset="100%" stop-color="#f0b34b"/>
    </linearGradient>
  </defs>

  <!-- Mark: dakdekker brandt bitumen (torch-on) -->
  <g transform="translate(0,14)">
    <!-- plat daklijn -->
    <rect x="8" y="92" width="104" height="8" rx="4" fill="#1a5c3a"/>

    <!-- dakdekker: knielende figuur -->
    <!-- hoofd -->
    <circle cx="38" cy="30" r="11" fill="#1a5c3a"/>
    <!-- romp (gebogen) -->
    <path d="M30 46 C30 60 40 70 52 78 L52 90 L30 90 L26 60 Z" fill="#1a5c3a"/>
    <!-- been (knielend) -->
    <path d="M44 90 L44 78 L58 78 L58 90 Z" fill="#155030"/>
    <!-- arm naar voren (brander vasthouden) -->
    <path d="M46 52 L78 66 L78 74 L44 62 Z" fill="#155030"/>

    <!-- brander staaf -->
    <rect x="76" y="68" width="40" height="5" rx="2.5" fill="#0f2b1e" transform="rotate(-6 76 68)"/>
    <!-- brander kop -->
    <rect x="112" y="58" width="10" height="8" rx="2" fill="#0f2b1e" transform="rotate(-6 112 58)"/>

    <!-- vlam -->
    <path d="M118 50 C124 42 128 34 126 26 C134 34 136 44 130 52 Z" fill="url(#flame)"/>
    <!-- kleine binnen-vlam -->
    <path d="M122 46 C125 42 127 38 126 34 C130 40 130 46 126 50 Z" fill="#fff3d6"/>
  </g>

  <!-- Wordmark -->
  <text x="146" y="66" font-family="Inter, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#1a5c3a" letter-spacing="-1">Benzan</text>
  <text x="146" y="92" font-family="Inter, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#d4832b" letter-spacing="5">DAK</text>
</svg>
