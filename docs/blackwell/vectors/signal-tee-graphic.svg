<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="280mm" height="210mm">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a84e"/>
      <stop offset="50%" stop-color="#d4b860"/>
      <stop offset="100%" stop-color="#b8963c"/>
    </linearGradient>
  </defs>

  <!-- Background: charcoal tee color -->
  <rect width="800" height="600" fill="#2a2622"/>

  <!-- Diagonal strike 1 — Dusty Rose -->
  <g transform="rotate(-14, 400, 300)">
    <rect x="-200" y="296" width="1200" height="2" fill="#c47a6b" opacity="0.7"/>
  </g>

  <!-- Diagonal strike 2 — Saffron -->
  <g transform="rotate(9, 400, 300)">
    <rect x="-200" y="316" width="1200" height="2" fill="#d4953a" opacity="0.6"/>
  </g>

  <!-- Horizontal accent line -->
  <line x1="100" y1="380" x2="700" y2="380" stroke="#d4b860" stroke-width="1" opacity="0.3"/>

  <!-- "SIGNAL" text -->
  <text x="400" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-style="italic" font-size="140" fill="url(#goldGrad)" letter-spacing="3">SIGNAL</text>

  <!-- "THROUGH NOISE" text -->
  <text x="400" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="300" font-size="18" fill="#d4b860" fill-opacity="0.5" letter-spacing="9">THROUGH NOISE</text>

  <!-- Saffron dot -->
  <circle cx="600" cy="195" r="6" fill="#d4953a"/>

  <!-- Rose dot -->
  <circle cx="220" cy="370" r="4.5" fill="#c47a6b"/>

  <!-- Gold dot -->
  <circle cx="560" cy="310" r="3" fill="#d4b860"/>

  <!-- "DROP 002" tag -->
  <rect x="345" y="430" width="110" height="20" rx="2" fill="none" stroke="#d4b860" stroke-opacity="0.3" stroke-width="1"/>
  <text x="400" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#d4b860" fill-opacity="0.35" letter-spacing="3">"DROP 002"</text>
</svg>
